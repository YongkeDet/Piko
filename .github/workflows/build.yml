name: Build Chinese Piko release

on:
  push:
    branches: [main]
    paths:
      - 'RELEASE.json'
      - 'UPSTREAM.json'
      - 'build_piko.py'
      - 'build_cloud.py'
      - 'localizations/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: piko-chinese-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read release version
        id: release
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("RELEASE.json"))["version"])')
          [[ "$VERSION" =~ ^X\.[0-9]{2}\.[0-9]{2}$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build pinned source with Chinese resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
        run: python build_cloud.py
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Create version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; its tag and files will be preserved."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file dist/release-notes.md \
            "dist/$VERSION.mpp" dist/build-info.json dist/SHA256SUMS
