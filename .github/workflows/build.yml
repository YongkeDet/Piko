name: Build Chinese Piko release

on:
  push:
    branches: [main]
    paths:
      - 'RELEASE.json'
      - 'UPSTREAM.json'
      - 'build_piko.py'
      - 'build_cloud.py'
      - 'localizations/**'
      - 'source-patches/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/publish_release.py'
  workflow_dispatch:
  pull_request:
    paths:
      - 'RELEASE.json'
      - 'UPSTREAM.json'
      - 'build_piko.py'
      - 'build_cloud.py'
      - 'localizations/**'
      - 'source-patches/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: piko-chinese-release-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read release version
        id: release
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("RELEASE.json"))["version"])')
          [[ "$VERSION" =~ ^X\.[0-9]{2}\.[0-9]{2}$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build pinned source with Chinese resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
        run: python build_cloud.py
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Publish or update the configured release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_release.py
      - name: Update remote patch subscription
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          PUBLISHED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha')
          if [[ "$PUBLISHED_SHA" != "$GITHUB_SHA" ]]; then
            echo "Existing release belongs to a different commit; preserving its subscription."
            exit 0
          fi
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          CURRENT_VERSION=$(python3 -c 'import json; print(json.load(open("RELEASE.json"))["version"])')
          if [[ "$CURRENT_VERSION" != "$VERSION" ]]; then
            echo "A newer version is configured on main; leaving its subscription unchanged."
            exit 0
          fi
          cp dist/patches-bundle.json patches-bundle.json
          git add patches-bundle.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update subscription to $VERSION [skip ci]"
          git push origin HEAD:main
